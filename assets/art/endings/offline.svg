<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>Universo desconectado</title>
  <desc>El fragmento apaga el Universo 404 como un monitor antiguo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="55%" stop-color="#111921"/>
      <stop offset="100%" stop-color="#1b1e25"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#8dd6d7" stop-opacity=".95"/>
      <stop offset="38%" stop-color="#d96f7a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".25">
    <circle cx="280" cy="120" r="2" fill="#fff"/><circle cx="390" cy="210" r="2" fill="#fff"/><circle cx="1320" cy="220" r="3" fill="#fff"/><circle cx="1240" cy="90" r="2" fill="#fff"/><circle cx="1120" cy="160" r="2" fill="#fff"/><circle cx="980" cy="100" r="2" fill="#fff"/><circle cx="150" cy="340" r="2" fill="#fff"/><circle cx="1450" cy="380" r="2" fill="#fff"/>
  </g>
  <circle cx="820" cy="320" r="245" fill="url(#orb)"/>
  <g filter="url(#blur)" opacity=".4"><ellipse cx="820" cy="760" rx="480" ry="90" fill="#8dd6d7" opacity=".07"/></g>
  <rect x="360" y="150" width="880" height="560" rx="28" fill="#0b1016" stroke="#8dd6d7" stroke-width="5"/><rect x="405" y="195" width="790" height="470" rx="16" fill="#111720"/><path d="M520 500 C690 300 910 290 1080 500" stroke="#d96f7a" stroke-width="8" fill="none" opacity=".35"/><circle cx="800" cy="430" r="130" fill="#8dd6d7" opacity=".18"/><path d="M710 430 h180" stroke="#d6b36a" stroke-width="8" opacity=".7"/><path d="M800 340 v180" stroke="#d6b36a" stroke-width="8" opacity=".7"/>
  <rect x="40" y="40" width="1520" height="820" rx="18" fill="none" stroke="#d6b36a" stroke-opacity=".35" stroke-width="2"/>
</svg>