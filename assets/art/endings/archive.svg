<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>El Archivista</title>
  <desc>Un archivo vivo contiene la frecuencia y la vigila.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040609"/>
      <stop offset="55%" stop-color="#15222b"/>
      <stop offset="100%" stop-color="#20121d"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#d6b36a" stop-opacity=".95"/>
      <stop offset="38%" stop-color="#8dd6d7" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".25">
    <circle cx="280" cy="120" r="2" fill="#fff"/><circle cx="390" cy="210" r="2" fill="#fff"/><circle cx="1320" cy="220" r="3" fill="#fff"/><circle cx="1240" cy="90" r="2" fill="#fff"/><circle cx="1120" cy="160" r="2" fill="#fff"/><circle cx="980" cy="100" r="2" fill="#fff"/><circle cx="150" cy="340" r="2" fill="#fff"/><circle cx="1450" cy="380" r="2" fill="#fff"/>
  </g>
  <circle cx="820" cy="320" r="245" fill="url(#orb)"/>
  <g filter="url(#blur)" opacity=".4"><ellipse cx="780" cy="740" rx="420" ry="110" fill="#8dd6d7" opacity=".08"/></g>
  <rect x="470" y="150" width="660" height="560" rx="24" fill="#0e141b" stroke="#d6b36a" stroke-width="4"/><path d="M560 250 H1040" stroke="#8dd6d7" stroke-width="6" opacity=".5"/><path d="M560 330 H940" stroke="#8dd6d7" stroke-width="6" opacity=".4"/><path d="M560 410 H990" stroke="#8dd6d7" stroke-width="6" opacity=".35"/><circle cx="1070" cy="240" r="90" fill="#d6b36a" opacity=".22"/><circle cx="1070" cy="240" r="32" fill="#8dd6d7" opacity=".5"/>
  <rect x="40" y="40" width="1520" height="820" rx="18" fill="none" stroke="#d6b36a" stroke-opacity=".35" stroke-width="2"/>
</svg>