<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>Descenso al expediente</title>
  <desc>Los investigadores descienden hacia una Black Hollow que no figura en los mapas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040507"/>
      <stop offset="55%" stop-color="#0b1015"/>
      <stop offset="100%" stop-color="#13171f"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#8f74ba" stop-opacity=".95"/>
      <stop offset="38%" stop-color="#d6b36a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".25">
    <circle cx="280" cy="120" r="2" fill="#fff"/><circle cx="390" cy="210" r="2" fill="#fff"/><circle cx="1320" cy="220" r="3" fill="#fff"/><circle cx="1240" cy="90" r="2" fill="#fff"/><circle cx="1120" cy="160" r="2" fill="#fff"/><circle cx="980" cy="100" r="2" fill="#fff"/><circle cx="150" cy="340" r="2" fill="#fff"/><circle cx="1450" cy="380" r="2" fill="#fff"/>
  </g>
  <circle cx="820" cy="320" r="245" fill="url(#orb)"/>
  <g filter="url(#blur)" opacity=".4"><ellipse cx="780" cy="720" rx="460" ry="130" fill="#8f74ba" opacity=".18"/><ellipse cx="820" cy="760" rx="620" ry="100" fill="#d6b36a" opacity=".08"/></g>
  <path d="M180 760 Q450 540 790 410 T1440 760Z" fill="#070a0f"/><path d="M780 100 L1020 760 H540 Z" fill="#101722" opacity=".88"/><path d="M740 180 L880 560 H650 Z" fill="#d6b36a" opacity=".22"/><circle cx="790" cy="520" r="92" fill="#8f74ba" opacity=".18"/><path d="M505 770 q110-250 290-250 q180 0 300 250" fill="none" stroke="#8dd6d7" stroke-width="4" opacity=".25"/>
  <rect x="40" y="40" width="1520" height="820" rx="18" fill="none" stroke="#d6b36a" stroke-opacity=".35" stroke-width="2"/>
</svg>