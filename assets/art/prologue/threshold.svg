  <g filter="url(#blur)" opacity=".4"><ellipse cx="800" cy="740" rx="520" ry="110" fill="#d6b36a" opacity=".1"/><ellipse cx="780" cy="720" rx="340" ry="80" fill="#8dd6d7" opacity=".1"/></g>
  <rect x="560" y="160" width="480" height="560" rx="22" fill="#121925"/><rect x="615" y="210" width="370" height="460" rx="16" fill="#070b0f" stroke="#d6b36a" stroke-width="4" opacity=".9"/><ellipse cx="800" cy="445" rx="150" ry="210" fill="#8dd6d7" opacity=".18"/><circle cx="800" cy="445" r="54" fill="#d6b36a" opacity=".42"/><path d="M280 760 Q530 560 640 640 T1320 760" fill="#090d11"/>
  <rect x="40" y="40" width="1520" height="820" rx="18" fill="none" stroke="#d6b36a" stroke-opacity=".35" stroke-width="2"/>
