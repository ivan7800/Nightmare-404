      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="55%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#1a0f18"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="42%" r="42%">
