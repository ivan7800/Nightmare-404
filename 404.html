<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="robots" content="noindex">
  <title>Frecuencia perdida — Nightmare 404</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 50% 35%,#17222b 0,#080b0f 38%,#030405 78%);color:#edf1f2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);box-shadow:inset 0 0 130px #000}.panel{position:relative;width:min(680px,100%);padding:clamp(1.4rem,5vw,3rem);border:1px solid #536674;border-radius:18px;background:rgba(7,12,17,.88);box-shadow:0 30px 100px #000;text-align:center}.code{margin:0;color:#ff5266;font-size:clamp(5rem,22vw,11rem);font-weight:900;line-height:.8;letter-spacing:-.1em;text-shadow:4px 0 #244b5c,-3px 0 #86192a}h1{margin:1.4rem 0 .5rem;font-size:clamp(1.5rem,5vw,2.7rem)}p{color:#a9b4bb}a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;margin-top:1rem;padding:.7rem 1rem;border:1px solid #ff5266;border-radius:9px;background:#3e101a;color:#fff;text-decoration:none;text-transform:uppercase;letter-spacing:.07em}.signal{color:#85d18c;font-size:.7rem;letter-spacing:.14em}</style>
</head>
<body>
  <main class="panel">
    <p class="signal">SEÑAL INTERRUMPIDA · RUTA NO REGISTRADA</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta frecuencia no existe</h1>
    <p>La dirección solicitada no pertenece a ningún expediente de Black Hollow. Regresando al punto de acceso seguro.</p>
    <a id="home-link" href="/">Volver a Nightmare 404</a>
  </main>
  <script>
    (() => {
      const parts = location.pathname.split('/').filter(Boolean);
      const root = location.hostname.endsWith('github.io') && parts.length ? `/${parts[0]}/` : '/';
      const link = document.getElementById('home-link');
      link.href = root;
      window.setTimeout(() => location.replace(root), 2400);
    })();
  </script>
</body>
</html>
